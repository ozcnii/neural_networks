<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>
  <defs>
    <marker id="fwd" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="bwd" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Метод обратного распространения ошибки</text>

  <!-- layers -->
  <g>
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"><circle cx="110" cy="150" r="22"/></g>
    <text x="110" y="155" text-anchor="middle" font-size="12">вход</text>
    <g fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"><circle cx="300" cy="120" r="22"/><circle cx="300" cy="190" r="22"/></g>
    <text x="300" y="95" text-anchor="middle" font-size="11" fill="#64748b">скрытый</text>
    <g fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"><circle cx="480" cy="120" r="22"/><circle cx="480" cy="190" r="22"/></g>
    <text x="480" y="95" text-anchor="middle" font-size="11" fill="#64748b">скрытый</text>
    <g fill="#bfdbfe" stroke="#2563eb" stroke-width="2"><circle cx="650" cy="150" r="24"/></g>
    <text x="650" y="155" text-anchor="middle" font-size="12">ŷ</text>
  </g>

  <!-- forward arrows (blue, top) -->
  <g stroke="#2563eb" stroke-width="2" fill="none">
    <line x1="132" y1="143" x2="278" y2="125" marker-end="url(#fwd)"/>
    <line x1="132" y1="157" x2="278" y2="185" marker-end="url(#fwd)"/>
    <line x1="322" y1="120" x2="458" y2="120" marker-end="url(#fwd)"/>
    <line x1="322" y1="190" x2="458" y2="190" marker-end="url(#fwd)"/>
    <line x1="502" y1="125" x2="626" y2="143" marker-end="url(#fwd)"/>
    <line x1="502" y1="185" x2="626" y2="157" marker-end="url(#fwd)"/>
  </g>
  <rect x="250" y="44" width="260" height="26" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="380" y="62" text-anchor="middle" font-size="12.5" fill="#1e40af" font-weight="600">① FORWARD: вход → выход, считаем ŷ</text>

  <!-- backward arrows (red, bottom) -->
  <g stroke="#dc2626" stroke-width="1.8" fill="none" stroke-dasharray="5 3">
    <line x1="628" y1="170" x2="504" y2="205" marker-end="url(#bwd)"/>
    <line x1="628" y1="172" x2="504" y2="138" marker-end="url(#bwd)"/>
    <line x1="458" y1="205" x2="322" y2="205" marker-end="url(#bwd)"/>
    <line x1="458" y1="135" x2="322" y2="135" marker-end="url(#bwd)"/>
    <line x1="278" y1="205" x2="134" y2="168" marker-end="url(#bwd)"/>
    <line x1="278" y1="135" x2="134" y2="166" marker-end="url(#bwd)"/>
  </g>
  <rect x="225" y="250" width="310" height="26" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="380" y="268" text-anchor="middle" font-size="12.5" fill="#b91c1c" font-weight="600">② BACKWARD: ошибка течёт назад, правим веса</text>

  <!-- error block -->
  <rect x="690" y="130" width="60" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="720" y="148" text-anchor="middle" font-size="11" fill="#b45309">ошибка</text>
  <text x="720" y="163" text-anchor="middle" font-size="10" fill="#92400e">L=(y−ŷ)²</text>

  <!-- steps -->
  <text x="380" y="305" text-anchor="middle" font-size="12.5" fill="#0f172a">по цепному правилу: ∂L/∂w = ∂L/∂ŷ · ∂ŷ/∂s · ∂s/∂w  →  обновляем: <tspan font-weight="700">w ← w − α·(∂L/∂w)</tspan></text>
  <text x="380" y="326" text-anchor="middle" font-size="11" fill="#64748b">повторяем тысячи раз → ошибка падает</text>
</svg>
