<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>
  <defs>
    <marker id="a10" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Свёрточная сеть: от простых признаков к сложным</text>

  <!-- pipeline blocks -->
  <g>
    <!-- image -->
    <rect x="30" y="90" width="90" height="90" rx="6" fill="#e2e8f0" stroke="#64748b"/>
    <g fill="#94a3b8"><rect x="45" y="120" width="20" height="20"/><rect x="75" y="105" width="25" height="35"/><rect x="55" y="150" width="40" height="14"/></g>
    <text x="75" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">изображение</text>

    <!-- conv 1 -->
    <rect x="170" y="95" width="80" height="80" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="210" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">свёртка</text>
    <text x="210" y="148" text-anchor="middle" font-size="10.5" fill="#15803d">ядро 3×3</text>
    <text x="210" y="200" text-anchor="middle" font-size="11" fill="#334155">карта признаков</text>

    <!-- pool 1 -->
    <rect x="300" y="105" width="62" height="62" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="331" y="132" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">пулинг</text>
    <text x="331" y="148" text-anchor="middle" font-size="10" fill="#1e40af">↓ размер</text>

    <!-- conv/pool deeper -->
    <rect x="410" y="112" width="48" height="48" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="434" y="140" text-anchor="middle" font-size="10.5" font-weight="700" fill="#15803d">…глубже</text>
    <text x="434" y="200" text-anchor="middle" font-size="11" fill="#334155">сложные признаки</text>

    <!-- FC -->
    <g fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.3">
      <circle cx="520" cy="110" r="10"/><circle cx="520" cy="136" r="10"/><circle cx="520" cy="162" r="10"/>
      <circle cx="560" cy="123" r="10"/><circle cx="560" cy="149" r="10"/>
    </g>
    <g stroke="#ddd6fe" stroke-width="1">
      <line x1="530" y1="110" x2="550" y2="123"/><line x1="530" y1="110" x2="550" y2="149"/>
      <line x1="530" y1="136" x2="550" y2="123"/><line x1="530" y1="136" x2="550" y2="149"/>
      <line x1="530" y1="162" x2="550" y2="123"/><line x1="530" y1="162" x2="550" y2="149"/>
    </g>
    <text x="540" y="200" text-anchor="middle" font-size="11" fill="#334155">полносвязные</text>

    <!-- answer -->
    <rect x="625" y="118" width="105" height="44" rx="9" fill="#1e293b"/>
    <text x="677" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">«кошка»</text>
    <text x="677" y="200" text-anchor="middle" font-size="11" fill="#334155">классификация</text>
  </g>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <line x1="122" y1="135" x2="166" y2="135" marker-end="url(#a10)"/>
    <line x1="252" y1="135" x2="296" y2="135" marker-end="url(#a10)"/>
    <line x1="364" y1="135" x2="406" y2="135" marker-end="url(#a10)"/>
    <line x1="460" y1="135" x2="500" y2="135" marker-end="url(#a10)"/>
    <line x1="574" y1="135" x2="621" y2="135" marker-end="url(#a10)"/>
  </g>

  <!-- bottom gradient bar -->
  <rect x="30" y="245" width="700" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="160" y="267" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="600">ПРОСТЫЕ: линии, градиенты</text>
  <text x="380" y="267" text-anchor="middle" font-size="12" fill="#475569">──────────►</text>
  <text x="600" y="267" text-anchor="middle" font-size="12" fill="#7e22ce" font-weight="600">СЛОЖНЫЕ: морда, объект</text>
</svg>
