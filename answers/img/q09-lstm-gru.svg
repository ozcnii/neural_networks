<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>
  <defs>
    <marker id="a9" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">LSTM и GRU — управляемая «память» рекуррентной сети</text>

  <!-- LSTM -->
  <rect x="30" y="55" width="350" height="225" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="205" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">LSTM (1997) — 3 вентиля</text>
  <!-- memory line -->
  <line x1="55" y1="115" x2="355" y2="115" stroke="#1e40af" stroke-width="3"/>
  <text x="205" y="107" text-anchor="middle" font-size="11" fill="#1e40af">линия памяти (cell state)</text>
  <!-- gates -->
  <g font-size="12" text-anchor="middle">
    <rect x="70"  y="150" width="80" height="46" rx="9" fill="#fee2e2" stroke="#dc2626"/><text x="110" y="170" fill="#b91c1c" font-weight="600">забыть?</text><text x="110" y="186" font-size="10" fill="#7f1d1d">вентиль</text>
    <rect x="165" y="150" width="80" height="46" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="205" y="170" fill="#15803d" font-weight="600">впустить?</text><text x="205" y="186" font-size="10" fill="#14532d">вентиль</text>
    <rect x="260" y="150" width="80" height="46" rx="9" fill="#fef3c7" stroke="#f59e0b"/><text x="300" y="170" fill="#b45309" font-weight="600">выдать?</text><text x="300" y="186" font-size="10" fill="#78350f">вентиль</text>
  </g>
  <g stroke="#475569" stroke-width="1.4" fill="none">
    <line x1="110" y1="150" x2="110" y2="118" marker-end="url(#a9)"/>
    <line x1="205" y1="150" x2="205" y2="118" marker-end="url(#a9)"/>
  </g>
  <text x="205" y="232" text-anchor="middle" font-size="11.5" fill="#334155">вентиль = «краник» 0…1: сколько информации пропустить</text>
  <text x="205" y="258" text-anchor="middle" font-size="11.5" fill="#475569">мощно и точно, но тяжело считать</text>

  <!-- GRU -->
  <rect x="400" y="55" width="330" height="225" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="565" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">GRU — упрощённый, быстрее</text>
  <!-- inputs/outputs -->
  <line x1="425" y1="160" x2="468" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#a9)"/>
  <text x="420" y="145" text-anchor="middle" font-size="12">x<tspan font-size="9" dy="3">t</tspan></text>
  <text x="420" y="185" text-anchor="middle" font-size="12">h<tspan font-size="9" dy="3">t-1</tspan></text>
  <rect x="470" y="130" width="150" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="545" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">вентиль обновления</text>
  <text x="545" y="176" text-anchor="middle" font-size="11" fill="#14532d">+ выходной</text>
  <line x1="620" y1="160" x2="665" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#a9)"/>
  <text x="678" y="164" text-anchor="middle" font-size="12">h<tspan font-size="9" dy="3">t</tspan></text>
  <text x="565" y="226" text-anchor="middle" font-size="11.5" fill="#334155">2 входа → 1 выход, вентилей меньше</text>
  <text x="565" y="252" text-anchor="middle" font-size="11.5" fill="#475569">качество ≈ LSTM, но вычислений меньше</text>

  <text x="380" y="305" text-anchor="middle" font-size="12.5" fill="#64748b">Оба решают беду обычной RNN: «теряет нить» на длинных зависимостях</text>
</svg>
