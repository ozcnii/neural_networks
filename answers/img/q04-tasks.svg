<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="760" height="430" fill="#ffffff"/>
  <defs>
    <marker id="a4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Классические задачи машинного обучения</text>

  <!-- root -->
  <rect x="300" y="48" width="160" height="40" rx="10" fill="#1e293b"/>
  <text x="380" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">машинное обучение</text>

  <!-- connectors -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <path d="M380,88 L380,104 L140,104 L140,124" marker-end="url(#a4)"/>
    <path d="M380,88 L380,124" marker-end="url(#a4)"/>
    <path d="M380,88 L380,104 L620,104 L620,124" marker-end="url(#a4)"/>
  </g>

  <!-- three branches -->
  <g font-size="13" font-weight="700">
    <rect x="40"  y="124" width="200" height="38" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="140" y="148" text-anchor="middle" fill="#1e40af">С УЧИТЕЛЕМ</text>
    <rect x="280" y="124" width="200" height="38" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="380" y="148" text-anchor="middle" fill="#15803d">БЕЗ УЧИТЕЛЯ</text>
    <rect x="520" y="124" width="210" height="38" rx="9" fill="#fef3c7" stroke="#f59e0b"/><text x="625" y="148" text-anchor="middle" fill="#b45309">С ПОДКРЕПЛЕНИЕМ</text>
  </g>
  <g font-size="11" font-style="italic" fill="#64748b">
    <text x="140" y="177" text-anchor="middle">есть «правильные ответы»</text>
    <text x="380" y="177" text-anchor="middle">ответов нет, ищем структуру</text>
    <text x="625" y="177" text-anchor="middle">учимся на наградах</text>
  </g>

  <!-- leaves: supervised -->
  <g font-size="12.5" fill="#0f172a">
    <g>
      <rect x="36" y="192" width="208" height="26" rx="6" fill="#eff6ff"/><text x="46" y="210">• классификация <tspan fill="#64748b" font-size="11">(кошка/собака)</tspan></text>
      <rect x="36" y="224" width="208" height="26" rx="6" fill="#eff6ff"/><text x="46" y="242">• регрессия <tspan fill="#64748b" font-size="11">(цена квартиры)</tspan></text>
      <rect x="36" y="256" width="208" height="26" rx="6" fill="#eff6ff"/><text x="46" y="274">• прогнозирование <tspan fill="#64748b" font-size="11">(курс)</tspan></text>
      <rect x="36" y="288" width="208" height="26" rx="6" fill="#eff6ff"/><text x="46" y="306">• seq2seq <tspan fill="#64748b" font-size="11">(перевод)</tspan></text>
    </g>
    <!-- unsupervised -->
    <g>
      <rect x="276" y="192" width="208" height="26" rx="6" fill="#f0fdf4"/><text x="286" y="210">• кластеризация</text>
      <rect x="276" y="224" width="208" height="26" rx="6" fill="#f0fdf4"/><text x="286" y="242">• ассоц. правила <tspan fill="#64748b" font-size="11">(пиво+памперсы)</tspan></text>
      <rect x="276" y="256" width="208" height="26" rx="6" fill="#f0fdf4"/><text x="286" y="274">• фильтрация выбросов</text>
      <rect x="276" y="288" width="208" height="26" rx="6" fill="#f0fdf4"/><text x="286" y="306">• сокращение размерности</text>
      <rect x="276" y="320" width="208" height="26" rx="6" fill="#f0fdf4"/><text x="286" y="338">• заполнение пропусков</text>
    </g>
    <!-- reinforcement -->
    <g>
      <rect x="520" y="192" width="210" height="26" rx="6" fill="#fffbeb"/><text x="530" y="210">игры, роботы, биржа</text>
    </g>
  </g>

  <!-- intermediate -->
  <rect x="520" y="240" width="210" height="74" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="625" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">промежуточные</text>
  <text x="530" y="284" font-size="12" fill="#0f172a">• частичное (semi-supervised)</text>
  <text x="530" y="304" font-size="12" fill="#0f172a">• динамическое (online)</text>
</svg>
