<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="760" height="520" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">История ИНС: взлёты и «заморозки»</text>

  <!-- vertical spine -->
  <line x1="120" y1="60" x2="120" y2="488" stroke="#cbd5e1" stroke-width="3"/>

  <!-- phase bands -->
  <g font-size="12" font-weight="700">
    <rect x="600" y="60"  width="150" height="92"  rx="8" fill="#dbeafe"/><text x="675" y="110" text-anchor="middle" fill="#1e40af">ВЗЛЁТ</text>
    <rect x="600" y="160" width="150" height="46"  rx="8" fill="#fee2e2"/><text x="675" y="188" text-anchor="middle" fill="#b91c1c">ЗАМОРОЗКА</text>
    <rect x="600" y="214" width="150" height="200" rx="8" fill="#dcfce7"/><text x="675" y="308" text-anchor="middle" fill="#15803d">ВТОРОЕ</text><text x="675" y="324" text-anchor="middle" fill="#15803d">РОЖДЕНИЕ</text>
    <rect x="600" y="422" width="150" height="66"  rx="8" fill="#fef3c7"/><text x="675" y="450" text-anchor="middle" fill="#b45309">БУМ</text>
  </g>

  <!-- events -->
  <g font-size="13.5" fill="#0f172a">
    <!-- y positions -->
    <g>
      <circle cx="120" cy="78"  r="6" fill="#2563eb"/><text x="140" y="74" font-weight="700">1943</text><text x="186" y="74" fill="#334155">МакКаллок + Питтс — модель нейрона</text>
      <circle cx="120" cy="115" r="6" fill="#2563eb"/><text x="140" y="111" font-weight="700">1949</text><text x="186" y="111" fill="#334155">Хебб — правило обучения</text>
      <circle cx="120" cy="145" r="6" fill="#2563eb"/><text x="140" y="141" font-weight="700">1957</text><text x="186" y="141" fill="#334155">Розенблатт — персептрон, «Марк-1»</text>

      <circle cx="120" cy="183" r="6" fill="#dc2626"/><text x="140" y="179" font-weight="700">1969*</text><text x="194" y="179" fill="#334155">Минский + Пейперт — предел персептрона</text>

      <circle cx="120" cy="238" r="6" fill="#16a34a"/><text x="140" y="234" font-weight="700">1974</text><text x="186" y="234" fill="#334155">Галушкин (СССР) — обратное распространение</text>
      <circle cx="120" cy="272" r="6" fill="#16a34a"/><text x="140" y="268" font-weight="700">1982</text><text x="186" y="268" fill="#334155">Хопфилд — ассоциативная память</text>
      <circle cx="120" cy="306" r="6" fill="#16a34a"/><text x="140" y="302" font-weight="700">1984</text><text x="186" y="302" fill="#334155">Кохонен — обучение без учителя</text>
      <circle cx="120" cy="340" r="6" fill="#16a34a"/><text x="140" y="336" font-weight="700">1986</text><text x="186" y="336" fill="#334155">Румельхарт, Хинтон — развили backprop</text>
      <circle cx="120" cy="374" r="6" fill="#16a34a"/><text x="140" y="370" font-weight="700">1988</text><text x="186" y="370" fill="#334155">Лекун — свёрточные сети (CNN)</text>
      <circle cx="120" cy="404" r="6" fill="#16a34a"/><text x="140" y="400" font-weight="700">1997</text><text x="186" y="400" fill="#334155">Шмидхубер + Хохрайтер — LSTM</text>

      <circle cx="120" cy="442" r="6" fill="#d97706"/><text x="140" y="438" font-weight="700">2012→</text><text x="196" y="438" fill="#334155">эра бурного внедрения ИНС</text>
      <circle cx="120" cy="472" r="6" fill="#d97706"/><text x="140" y="468" font-weight="700">2017</text><text x="186" y="468" fill="#334155">трансформер → BERT, GPT, ChatGPT</text>
    </g>
  </g>
  <text x="20" y="508" font-size="11" fill="#94a3b8">* год книги Минского в учебнике не указан (1969 — общеизвестное)</text>
</svg>
