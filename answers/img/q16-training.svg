<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>
  <defs>
    <marker id="tr16" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Обучение сети: цикл «предсказал → ошибся → подправил»</text>

  <!-- training loop -->
  <g text-anchor="middle" font-size="12.5">
    <rect x="40"  y="80" width="130" height="50" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="105" y="100" fill="#1e40af">подаём вход</text><text x="105" y="118" font-size="10.5" fill="#1e40af">(пример из выборки)</text>
    <rect x="215" y="80" width="130" height="50" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="280" y="100" fill="#15803d">forward</text><text x="280" y="118" font-size="10.5" fill="#15803d">предсказание ŷ</text>
    <rect x="390" y="80" width="130" height="50" rx="9" fill="#fef3c7" stroke="#f59e0b"/><text x="455" y="100" fill="#b45309">сравнить с</text><text x="455" y="118" font-size="11" fill="#b45309">эталоном → ошибка</text>
    <rect x="565" y="80" width="150" height="50" rx="9" fill="#ede9fe" stroke="#8b5cf6"/><text x="640" y="100" fill="#6d28d9">backward:</text><text x="640" y="118" font-size="10.5" fill="#6d28d9">подправить веса</text>
  </g>
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <line x1="170" y1="105" x2="213" y2="105" marker-end="url(#tr16)"/>
    <line x1="345" y1="105" x2="388" y2="105" marker-end="url(#tr16)"/>
    <line x1="520" y1="105" x2="563" y2="105" marker-end="url(#tr16)"/>
    <!-- loop back -->
    <path d="M640,130 L640,165 L105,165 L105,132" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#tr16)"/>
  </g>
  <text x="380" y="158" text-anchor="middle" font-size="11.5" fill="#7e22ce">повторяем тысячи раз (эпохи) → ошибка падает</text>
  <text x="380" y="185" text-anchor="middle" font-size="12.5" fill="#0f172a">формула шага: <tspan font-weight="700">w ← w − α · (∂L/∂w)</tspan>   (α — скорость обучения)</text>

  <!-- single-layer perceptron: digit grid -->
  <text x="380" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Однослойный персептрон: распознаём цифру по сетке 3×5</text>

  <!-- 3x5 grid showing a "1" -->
  <g>
    <g stroke="#94a3b8" stroke-width="1">
      <!-- cells -->
      <rect x="250" y="245" width="24" height="24" fill="#fff"/><rect x="274" y="245" width="24" height="24" fill="#1e293b"/><rect x="298" y="245" width="24" height="24" fill="#fff"/>
      <rect x="250" y="269" width="24" height="24" fill="#fff"/><rect x="274" y="269" width="24" height="24" fill="#1e293b"/><rect x="298" y="269" width="24" height="24" fill="#fff"/>
      <rect x="250" y="293" width="24" height="24" fill="#fff"/><rect x="274" y="293" width="24" height="24" fill="#1e293b"/><rect x="298" y="293" width="24" height="24" fill="#fff"/>
      <rect x="250" y="317" width="24" height="24" fill="#fff"/><rect x="274" y="317" width="24" height="24" fill="#1e293b"/><rect x="298" y="317" width="24" height="24" fill="#fff"/>
      <rect x="250" y="341" width="24" height="24" fill="#fff"/><rect x="274" y="341" width="24" height="24" fill="#1e293b"/><rect x="298" y="341" width="24" height="24" fill="#fff"/>
    </g>
    <text x="286" y="380" text-anchor="middle" font-size="11" fill="#64748b">15 квадратов = 15 входов</text>
  </g>

  <!-- arrow to neuron -->
  <line x1="325" y1="305" x2="430" y2="305" stroke="#475569" stroke-width="1.6" marker-end="url(#tr16)"/>
  <text x="377" y="297" text-anchor="middle" font-size="10.5" fill="#475569">чёрный=1, белый=0</text>

  <!-- single neuron -->
  <circle cx="470" cy="305" r="26" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="470" y="310" text-anchor="middle" font-size="22" fill="#b45309">Σ</text>
  <line x1="496" y1="305" x2="560" y2="305" stroke="#2563eb" stroke-width="2" marker-end="url(#tr16)"/>
  <rect x="565" y="285" width="160" height="40" rx="9" fill="#dbeafe" stroke="#2563eb"/>
  <text x="645" y="303" text-anchor="middle" font-size="12.5" fill="#1e40af">ответ: «это 1»</text>
  <text x="645" y="319" text-anchor="middle" font-size="10.5" fill="#1e40af">сравнить с правильным → подправить веса</text>
</svg>
