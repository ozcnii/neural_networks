<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>
  <defs>
    <marker id="f7" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Полносвязная сеть прямого распространения</text>

  <!-- layer labels -->
  <g font-size="13" fill="#64748b" text-anchor="middle">
    <text x="110" y="70">вход</text>
    <text x="320" y="70">скрытый 1</text>
    <text x="530" y="70">скрытый 2</text>
    <text x="690" y="70">выход</text>
  </g>

  <!-- fully connected edges (draw first, behind nodes) -->
  <g stroke="#cbd5e1" stroke-width="1">
    <!-- input(3) -> hidden1(4) -->
    <g>
      <line x1="110" y1="120" x2="320" y2="110"/><line x1="110" y1="120" x2="320" y2="170"/><line x1="110" y1="120" x2="320" y2="230"/><line x1="110" y1="120" x2="320" y2="290"/>
      <line x1="110" y1="200" x2="320" y2="110"/><line x1="110" y1="200" x2="320" y2="170"/><line x1="110" y1="200" x2="320" y2="230"/><line x1="110" y1="200" x2="320" y2="290"/>
      <line x1="110" y1="280" x2="320" y2="110"/><line x1="110" y1="280" x2="320" y2="170"/><line x1="110" y1="280" x2="320" y2="230"/><line x1="110" y1="280" x2="320" y2="290"/>
    </g>
    <!-- hidden1(4) -> hidden2(4) -->
    <g>
      <line x1="320" y1="110" x2="530" y2="110"/><line x1="320" y1="110" x2="530" y2="170"/><line x1="320" y1="110" x2="530" y2="230"/><line x1="320" y1="110" x2="530" y2="290"/>
      <line x1="320" y1="170" x2="530" y2="110"/><line x1="320" y1="170" x2="530" y2="170"/><line x1="320" y1="170" x2="530" y2="230"/><line x1="320" y1="170" x2="530" y2="290"/>
      <line x1="320" y1="230" x2="530" y2="110"/><line x1="320" y1="230" x2="530" y2="170"/><line x1="320" y1="230" x2="530" y2="230"/><line x1="320" y1="230" x2="530" y2="290"/>
      <line x1="320" y1="290" x2="530" y2="110"/><line x1="320" y1="290" x2="530" y2="170"/><line x1="320" y1="290" x2="530" y2="230"/><line x1="320" y1="290" x2="530" y2="290"/>
    </g>
    <!-- hidden2(4) -> output(2) -->
    <g>
      <line x1="530" y1="110" x2="690" y2="160"/><line x1="530" y1="110" x2="690" y2="240"/>
      <line x1="530" y1="170" x2="690" y2="160"/><line x1="530" y1="170" x2="690" y2="240"/>
      <line x1="530" y1="230" x2="690" y2="160"/><line x1="530" y1="230" x2="690" y2="240"/>
      <line x1="530" y1="290" x2="690" y2="160"/><line x1="530" y1="290" x2="690" y2="240"/>
    </g>
  </g>

  <!-- nodes -->
  <g>
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="1.5">
      <circle cx="110" cy="120" r="16"/><circle cx="110" cy="200" r="16"/><circle cx="110" cy="280" r="16"/>
    </g>
    <g fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5">
      <circle cx="320" cy="110" r="16"/><circle cx="320" cy="170" r="16"/><circle cx="320" cy="230" r="16"/><circle cx="320" cy="290" r="16"/>
      <circle cx="530" cy="110" r="16"/><circle cx="530" cy="170" r="16"/><circle cx="530" cy="230" r="16"/><circle cx="530" cy="290" r="16"/>
    </g>
    <g fill="#bfdbfe" stroke="#2563eb" stroke-width="2">
      <circle cx="690" cy="160" r="18"/><circle cx="690" cy="240" r="18"/>
    </g>
  </g>

  <!-- direction arrow -->
  <line x1="110" y1="330" x2="690" y2="330" stroke="#2563eb" stroke-width="2" marker-end="url(#f7)"/>
  <text x="400" y="322" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="600">сигнал идёт только ВПЕРЁД (обратных связей нет)</text>
</svg>
