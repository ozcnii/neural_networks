<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a8" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="a8g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Рекуррентная сеть: обратная связь = память</text>

  <!-- left: folded -->
  <text x="170" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Свёрнуто</text>
  <line x1="60" y1="150" x2="118" y2="150" stroke="#475569" stroke-width="1.6" marker-end="url(#a8)"/><text x="55" y="135" text-anchor="middle" font-size="13">x</text>
  <rect x="120" y="120" width="90" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="165" y="155" text-anchor="middle" font-size="13">слой</text>
  <line x1="210" y1="150" x2="268" y2="150" stroke="#475569" stroke-width="1.6" marker-end="url(#a8)"/><text x="278" y="135" text-anchor="middle" font-size="13">y</text>
  <!-- self loop -->
  <path d="M165,120 C165,85 225,85 225,120 L210,150" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a8g)"/>
  <text x="165" y="220" text-anchor="middle" font-size="12" fill="#15803d">выход → снова на вход</text>

  <!-- divider -->
  <line x1="320" y1="60" x2="320" y2="250" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- right: unrolled -->
  <text x="540" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Развёрнуто во времени</text>
  <g>
    <!-- cells -->
    <g fill="#dcfce7" stroke="#16a34a" stroke-width="2">
      <rect x="370" y="120" width="64" height="56" rx="9"/>
      <rect x="490" y="120" width="64" height="56" rx="9"/>
      <rect x="610" y="120" width="64" height="56" rx="9"/>
    </g>
    <g font-size="13" text-anchor="middle" fill="#15803d">
      <text x="402" y="153">h</text><text x="522" y="153">h</text><text x="642" y="153">h</text>
    </g>
    <!-- memory arrows between cells -->
    <line x1="434" y1="148" x2="488" y2="148" stroke="#16a34a" stroke-width="2" marker-end="url(#a8g)"/>
    <line x1="554" y1="148" x2="608" y2="148" stroke="#16a34a" stroke-width="2" marker-end="url(#a8g)"/>
    <!-- inputs -->
    <g stroke="#475569" stroke-width="1.5" fill="none">
      <line x1="402" y1="215" x2="402" y2="178" marker-end="url(#a8)"/>
      <line x1="522" y1="215" x2="522" y2="178" marker-end="url(#a8)"/>
      <line x1="642" y1="215" x2="642" y2="178" marker-end="url(#a8)"/>
    </g>
    <g font-size="13" text-anchor="middle" fill="#0f172a">
      <text x="402" y="232">x<tspan font-size="10" dy="3">1</tspan></text>
      <text x="522" y="232">x<tspan font-size="10" dy="3">2</tspan></text>
      <text x="642" y="232">x<tspan font-size="10" dy="3">3</tspan></text>
    </g>
  </g>
  <text x="540" y="280" text-anchor="middle" font-size="12" fill="#15803d">контекст накапливается шаг за шагом →</text>

  <!-- caption -->
  <text x="380" y="318" text-anchor="middle" font-size="12.5" fill="#64748b">Минус: шаги нельзя считать параллельно + взрывной/затухающий градиент на длинных цепочках</text>
</svg>
