<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="760" height="420" fill="#ffffff"/>
  <defs>
    <marker id="n11" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Обработка текста: путь от слов к ответу</text>

  <!-- pipeline -->
  <g text-anchor="middle" font-size="12.5">
    <rect x="30"  y="60" width="130" height="44" rx="9" fill="#e2e8f0" stroke="#64748b"/><text x="95" y="80" fill="#0f172a">текст</text><text x="95" y="96" font-size="10.5" fill="#475569">«…нельзя хорошим»</text>
    <rect x="190" y="60" width="140" height="44" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="260" y="80" fill="#1e40af">предобработка</text><text x="260" y="96" font-size="10" fill="#1e40af">токенизация, лемматизация</text>
    <rect x="360" y="60" width="140" height="44" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="430" y="80" fill="#15803d">векторизация</text><text x="430" y="96" font-size="10" fill="#15803d">слова → числа</text>
    <rect x="530" y="60" width="140" height="44" rx="9" fill="#ede9fe" stroke="#8b5cf6"/><text x="600" y="80" fill="#6d28d9">архитектура</text><text x="600" y="96" font-size="10" fill="#6d28d9">CNN1D / RNN / Transf.</text>
    <rect x="680" y="60" width="60" height="44" rx="9" fill="#1e293b"/><text x="710" y="86" fill="#fff" font-size="11">ответ</text>
  </g>
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <line x1="160" y1="82" x2="188" y2="82" marker-end="url(#n11)"/>
    <line x1="330" y1="82" x2="358" y2="82" marker-end="url(#n11)"/>
    <line x1="500" y1="82" x2="528" y2="82" marker-end="url(#n11)"/>
    <line x1="670" y1="82" x2="678" y2="82" marker-end="url(#n11)"/>
  </g>

  <!-- left: tasks -->
  <rect x="30" y="135" width="340" height="255" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="200" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Виды задач</text>
  <g font-size="12.5" fill="#334155">
    <text x="50" y="186">• машинный перевод</text>
    <text x="50" y="212">• анализ тональности (отзыв +/−)</text>
    <text x="50" y="238">• классификация по темам</text>
    <text x="50" y="264">• чат-боты, поддержка</text>
    <text x="50" y="290">• реферирование, инфопоиск</text>
    <text x="50" y="316">• именованные сущности (NER)</text>
    <text x="50" y="342">• распознавание / синтез речи</text>
    <text x="50" y="368">• генерация текста (ChatGPT)</text>
  </g>

  <!-- right: embeddings space + architectures -->
  <rect x="390" y="135" width="350" height="140" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="565" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Векторы слов (embeddings)</text>
  <text x="565" y="178" text-anchor="middle" font-size="11" fill="#64748b">похожие по смыслу слова — рядом</text>
  <!-- mini scatter -->
  <g font-size="11">
    <circle cx="470" cy="225" r="4" fill="#16a34a"/><text x="470" y="243" text-anchor="middle" fill="#15803d">собака</text>
    <circle cx="500" cy="212" r="4" fill="#16a34a"/><text x="503" y="206" text-anchor="middle" fill="#15803d">пёс</text>
    <circle cx="488" cy="240" r="4" fill="#16a34a"/><text x="492" y="258" text-anchor="middle" fill="#15803d">щенок</text>
    <circle cx="650" cy="218" r="4" fill="#dc2626"/><text x="650" y="236" text-anchor="middle" fill="#b91c1c">кот</text>
    <line x1="488" y1="226" x2="640" y2="220" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <text x="575" y="214" text-anchor="middle" font-size="9.5" fill="#94a3b8">далеко по смыслу</text>
  </g>

  <rect x="390" y="288" width="350" height="102" rx="12" fill="#faf5ff" stroke="#9333ea"/>
  <text x="565" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#7e22ce">Архитектуры</text>
  <g font-size="12" fill="#475569">
    <text x="410" y="336"><tspan font-weight="700" fill="#16a34a">1D-CNN</tspan> — контекст соседних слов, быстро</text>
    <text x="410" y="360"><tspan font-weight="700" fill="#f59e0b">RNN</tspan> (LSTM, GRU, ELMO) — помнит порядок</text>
    <text x="410" y="384"><tspan font-weight="700" fill="#9333ea">Трансформеры</tspan> (BERT, GPT) — лидер сегодня</text>
  </g>
</svg>
